interface:
  display_name: "AndThen - Issue Triage"
  short_description: "Triage incoming issue-tracker items – categorize, label, and route bugs and enhancements toward implementation or a human decision"
  default_prompt: "Triage incoming issue-tracker items. Resolve the tracker per github-publish.md Tracker resolution (GitHub is the default; a none/absent tracker with no GitHub remote → BLOCKED, point at the `andthen:init` skill). Fetch the working set (given number(s)/query, else the untriaged backlog). Per item: gather the domain concept, run the redundancy check (already implemented → comment pointing at the behavior + close, never wontfix), the prior-rejection check (Out of Scope Registry, concept-level → recommend wontfix), and verify the claim (bounded, non-destructive; skip with a stated reason). Classify bug/enhancement and recommend one state from needs-info / ready-for-agent / ready-for-human / wontfix, then confirm with the user before writing. Apply labels per the Label Role Mapping, post a rationale comment, and for ready-for-agent author an agent brief per references/agent-brief.md. A wontfix graduates the concept into the Out of Scope Registry (never an already-implemented closure). Route ready-for-agent items by size to the `andthen:quick-implement` skill; the `andthen:spec` skill then `andthen:exec-spec` skill; or the `andthen:plan` skill with `--issue`. Under --auto, apply only safe transitions and report wontfix / ready-for-agent / duplicate-close as recommendations. Scope: "

policy:
  allow_implicit_invocation: false
