interface:
  display_name: "AndThen - Exec Plan"
  short_description: "Execute a fully-specced plan bundle through the AndThen pipeline"
  default_prompt: "Execute every story in this plan bundle – one fresh exec-spec subagent per ready story, full verification, then the Next: line for the plan-level review. Flags: --auto, --worktree (independent stories in parallel, one worktree each), --no-full-tier. Plan directory: "

policy:
  allow_implicit_invocation: true
