name: Validate Plugin Content

# Chiefly the checks no local tier runs: version skew, Copilot CLI loading, Windows,
# and the Python floor. The `scripts` job also runs `scripts/validate-plugin.py`
# on every OS, the content check the plugin channels and loose installs rely on.
#
# The version gate keeps the manifests honest: plugin/ ships to Claude Code and
# Codex under separate manifests, and skew between any of the four version
# locations is a real observed failure mode.

# Runs on pull requests only: work lands on `develop` and `main` through them,
# so a check after the merge would re-run commits that already passed.
on:
  pull_request:
    branches: [main, develop]
    paths:
      - "plugin/**"
      - "scripts/**"
      - "evals/**"
      - "tests/**"
      - ".claude-plugin/**"
      - ".agents/**"
      - ".github/workflows/**"
      - "CHANGELOG.md"
      - "README.md"
      - "COOKBOOK.md"
      - "MIGRATING-FROM-0.x.md"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check version consistency across manifests and CHANGELOG
        run: |
          v_changelog=$(grep -m1 -oE '\[[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?\]' CHANGELOG.md | tr -d '[]')
          versions=$(
            jq -r '.plugins[0].version' .claude-plugin/marketplace.json
            jq -r '.version' plugin/.claude-plugin/plugin.json
            jq -r '.version' plugin/.codex-plugin/plugin.json
          )
          echo "changelog=$v_changelog four locations:"; echo "$versions"
          skew=$(printf '%s\n%s\n' "$versions" "$v_changelog" | sort -u | wc -l)
          if [ "$skew" -ne 1 ]; then
            echo "::error::version skew across CHANGELOG.md, .claude-plugin/marketplace.json (andthen), plugin/.claude-plugin/plugin.json, plugin/.codex-plugin/plugin.json"
            exit 1
          fi
      - name: Cookbook and README invocations resolve to the shipped surface
        # V1-PLAN §3.9: the docs are where a user learns what to type, so a
        # renamed skill or a cut flag is a broken instruction the moment it ships.
        run: python3 scripts/audit-cookbook.py
      - name: Check Codex marketplace manifest parses and serves the plugin dir
        run: |
          test "$(jq -r '.plugins | length' .agents/plugins/marketplace.json)" = "1"
          test "$(jq -r '.plugins[0].source.path' .agents/plugins/marketplace.json)" = "./plugin"

  # Copilot CLI installs the plugin from the Claude manifests but parses skill
  # frontmatter strictly, and its installer reports success when a skill fails
  # to load: only `skill list` names the failure. No auth or model call needed.
  copilot-load:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install the plugin on a pinned Copilot CLI and load every skill
        # Step-level env: GitHub rejects the `runner` context in job-level env.
        env:
          COPILOT_HOME: ${{ runner.temp }}/copilot-home
          COPILOT_AUTO_UPDATE: "false"
        run: |
          npm install -g @github/copilot@1.0.105
          copilot plugin marketplace add "$GITHUB_WORKSPACE"
          copilot plugin install andthen@andthen
          cd "$RUNNER_TEMP"
          copilot skill list > skills.txt 2>&1
          cat skills.txt
          if grep -q 'failed to load' skills.txt; then
            echo "::error::Copilot CLI failed to load a skill (see above)"
            exit 1
          fi
          # Absence of a failure proves nothing if the plugin never loaded at all.
          grep -q '^  clarify - ' skills.txt || { echo "::error::Copilot CLI lists no AndThen skills"; exit 1; }

  # The repo scripts (the loose-skill module above all, whose rewrites reach
  # every loose install) run on Linux and Windows, because path and
  # line-ending handling is where they diverge.
  scripts:
    name: scripts (${{ matrix.os }}, py${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # 3.12 is the floor; macOS is left to the local fast tier.
          - {os: ubuntu-latest, python: "3.12"}
          - {os: windows-latest, python: "3.x"}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # Every suite under tests/: the repo tooling (setup script, cookbook audit,
      # surface budget) and the shipped-content contracts. The notify suite
      # shells out to bash, so the whole step runs under it.
      - name: tests/ suites
        shell: bash
        run: python -m unittest discover -s tests
      # The evals harness is repo tooling, not shipped plugin content, and its
      # run directories are POSIX-shaped: Windows is out of scope for it.
      - name: evals check-evaluator and case-validation suite
        if: runner.os != 'Windows'
        run: python evals/test_checks.py
      # The validators walk the shipped tree and match paths and text, which is
      # exactly where line endings and case-insensitive filesystems diverge, so
      # they run on Windows as well as Linux.
      - name: Plugin content validations
        run: python scripts/validate-plugin.py
