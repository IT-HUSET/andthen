name: andthen-implement-fix-request-subject
description: Implement a small inline request with verification and no publication.
stepDefaults:
  - match: "*"
    provider: "@workflow"
    model: "@workflow"
steps:
  - id: implement-fix
    name: Implement shout
    skill: andthen:implement-fix
    prompt:
      - >-
        add shout(text) to src/reporter/text_tools.py, returning the text uppercased with any trailing exclamation marks replaced by exactly one (shout("hi") == "HI!", shout("hi!!") == "HI!"), with a unit test
    outputs:
      summary:
        format: text
