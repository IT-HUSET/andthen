name: andthen-review-clean-subject
description: Review a small, correct uncommitted change with the full code lens.
stepDefaults:
  - match: "*"
    provider: "@workflow"
    model: "@workflow"
steps:
  - id: review
    name: Run the full code review
    skill: andthen:review
    prompt: "prompt.md"
    outputs:
      review_result:
        format: json
        schema:
          type: object
          additionalProperties: false
          required: [findings, reportPath, verdict]
          properties:
            findings:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [id, title, location, severity, scopeRelation, routing]
                properties:
                  id: {type: string}
                  title: {type: string}
                  location: {type: string}
                  severity: {type: string}
                  scopeRelation: {type: string}
                  routing: {type: string}
            reportPath: {type: string}
            verdict: {type: string}
