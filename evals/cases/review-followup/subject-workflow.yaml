name: andthen-review-followup-subject
description: Follow up an earlier code review whose Fix finding was remediated and whose Note finding was surfaced.
stepDefaults:
  - match: "*"
    provider: "@workflow"
    model: "@workflow"
steps:
  - id: review
    name: Run the follow-up code review
    skill: andthen:review
    prompt: "prompt.md"
    outputs:
      review_result:
        format: json
        schema:
          type: object
          additionalProperties: false
          required: [findings, earlierFindings, reportPath, verdict]
          properties:
            findings:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [id, title, location, severity, routing]
                properties:
                  id: {type: string}
                  title: {type: string}
                  location: {type: string}
                  severity: {type: string}
                  routing: {type: string}
            earlierFindings:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [id, state]
                properties:
                  id: {type: string}
                  state: {type: string}
            reportPath: {type: string}
            verdict: {type: string}
