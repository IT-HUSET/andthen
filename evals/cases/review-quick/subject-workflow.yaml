name: andthen-review-quick-subject
description: Review the exporter package with the code lens on the quick path.
stepDefaults:
  - match: "*"
    provider: "@workflow"
    model: "@workflow"
steps:
  - id: review
    name: Run the quick code review
    skill: andthen:review
    prompt: "prompt.md"
    outputs:
      review_result:
        format: json
        schema:
          type: object
          additionalProperties: false
          required: [findings, label, reportWritten]
          properties:
            findings:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [id, title, location, severity, routing, anchor]
                properties:
                  id: {type: string}
                  title: {type: string}
                  location: {type: string}
                  severity: {type: string}
                  routing: {type: string}
                  anchor: {type: string}
            label: {type: string}
            reportWritten: {type: boolean}
