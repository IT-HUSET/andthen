name: andthen-spec-reentry-subject
description: Re-author a blocked standalone FIS with its settled decision.
stepDefaults:
  - match: "*"
    provider: "@workflow"
    model: "@workflow"
steps:
  - id: spec
    name: Re-author the blocked FIS
    skill: andthen:spec
    prompt:
      - >-
        docs/specs/retry-policy/s01-retry-policy.md
        
        Settled decision for the open backoff policy: exponential backoff starting at 200 ms and doubling each attempt, at most 3 retries, no jitter. Integrate it into the FIS prose that owns it, close as READY, and update the story record in the plan beside it.
      - >-
        Nothing else is open. Proceed with the decision exactly as given and finish closure.
    outputs:
      fis:
        format: text
