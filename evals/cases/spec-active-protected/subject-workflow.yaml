name: andthen-spec-protected-subject
description: Refuse to re-author a standalone FIS whose execution has begun.
stepDefaults:
  - match: "*"
    provider: "@workflow"
    model: "@workflow"
steps:
  - id: spec
    name: Attempt re-authoring of live state
    skill: andthen:spec
    prompt:
      - >-
        --auto docs/specs/retry-policy/s01-retry-policy.md
        
        Settled decision for the open backoff policy: exponential backoff starting at 200 ms and doubling each attempt, at most 3 retries, no jitter.
    outputs:
      outcome:
        format: text
